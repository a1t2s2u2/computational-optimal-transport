name = "ot"
defaultTargets = ["Ot"]

# Mathlib への実連携。MathlibCheck.lean が \blockmeta{lean=...} の対応先を
# #check で検証するために使う。初回は `lake exe cache get` でキャッシュ取得。
# 注意: 依存スケルトン Skeleton.lean は Mathlib を import しないため、
#       `lean Ot/Generated/Skeleton.lean` で Mathlib 無しに即検証できる。
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.30.0"

[[lean_lib]]
name = "Ot"
